name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -c requirements.lock -e '.[dev]'
      - name: Lint
        run: python -m ruff check src tests
      - name: Test
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -p no:cacheprovider
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist-wheel

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Typecheck and test
        working-directory: ui
        run: pnpm run typecheck && pnpm run test
      - name: Verify committed production bundle
        working-directory: ui
        run: pnpm run build
      - name: Check generated assets
        run: git diff --exit-code -- src/hsas/ui/web/modern-assets
