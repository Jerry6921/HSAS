name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Package product skills
        run: python scripts/package_agent_skills.py --output dist/hiqs-agent-skills.zip
      - uses: actions/upload-artifact@v4
        with:
          name: hiqs-agent-skills
          path: dist/hiqs-agent-skills.zip

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -c requirements.lock -e '.[dev]'
      - name: Audit locked dependencies
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.lock
      - name: Verify SQLite FTS5
        run: python -c "import sqlite3; connection = sqlite3.connect(':memory:'); connection.execute('CREATE VIRTUAL TABLE probe USING fts5(content)')"
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Verify Agent contract snapshots
        run: python scripts/generate_agent_contracts.py && git diff --exit-code -- contracts
      # Coverage varies slightly between interpreter versions, so the threshold is
      # enforced on exactly one leg. Every supported version still runs the suite.
      - name: Test
        if: matrix.python-version != '3.13'
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -p no:cacheprovider
      - name: Test with coverage gate
        if: matrix.python-version == '3.13'
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -p no:cacheprovider --cov=hsas --cov-report=term-missing --cov-fail-under=75
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist-wheel
      - name: Verify wheel installs and runs
        if: matrix.python-version == '3.13'
        run: |
          python -m venv wheelcheck
          wheelcheck/bin/pip install dist-wheel/*.whl
          wheelcheck/bin/hsas --help
