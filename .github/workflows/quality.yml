name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Package product skills
        run: python scripts/package_agent_skills.py --output dist/hiqs-agent-skills.zip
      - uses: actions/upload-artifact@v4
        with:
          name: hiqs-agent-skills
          path: dist/hiqs-agent-skills.zip

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -c requirements.lock -e '.[dev]'
      # pytest is dev-only; the only fix is pytest 9, tracked separately.
      - name: Audit locked dependencies
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install pip-audit
          python -m pip-audit -r requirements.lock --ignore-vuln PYSEC-2026-1845
      - name: Verify SQLite FTS5
        run: python -c "import sqlite3; connection = sqlite3.connect(':memory:'); connection.execute('CREATE VIRTUAL TABLE probe USING fts5(content)')"
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Verify Agent contract snapshots
        run: python scripts/generate_agent_contracts.py && git diff --exit-code -- contracts
      - name: Verify generated UI and TypeScript contracts
        run: python scripts/check_generated.py
      - name: Test
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -p no:cacheprovider --cov=hsas --cov-report=term-missing --cov-fail-under=75
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist-wheel
      - name: Verify wheel installs and runs
        if: matrix.python-version == '3.13'
        run: |
          python -m venv wheelcheck
          wheelcheck/bin/pip install dist-wheel/*.whl
          wheelcheck/bin/hsas --help

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install in app-compatible environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -c requirements.lock -e '.[dev]'
      - name: Verify macOS runtime and local server
        run: |
          .venv/bin/python -c "import sqlite3; connection = sqlite3.connect(':memory:'); connection.execute('CREATE VIRTUAL TABLE probe USING fts5(content)')"
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_macos_app.py tests/test_macos_launcher.py tests/test_run_dashboard.py
          .venv/bin/python -m hsas --help
      - name: Build and verify native app
        run: |
          scripts/build_macos_app.sh
          test -x dist/HIQS.app/Contents/MacOS/HIQS
          codesign --verify --deep --strict dist/HIQS.app

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Typecheck and test
        working-directory: ui
        run: pnpm run typecheck && pnpm run test
      - name: Verify committed production bundle
        working-directory: ui
        run: pnpm run build
      - name: Check generated assets
        run: git diff --exit-code -- src/hsas/web/static/modern-assets
