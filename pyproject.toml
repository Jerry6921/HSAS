[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "hku-study-assistance-system"
version = "1.0.0"
description = "HKU Study Assistance System with Moodle collection, deterministic prioritization, and local RAG"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "playwright>=1.48,<2",
  "platformdirs>=4.3,<5",
  "pydantic>=2.9,<3",
  "python-dotenv>=1,<2",
  "pypdf>=6,<7",
  "rich>=13.9,<16",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff==0.16.5",
]

[project.scripts]
hsas = "hsas.interfaces.run_cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hsas"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]
