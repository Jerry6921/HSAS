name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install locked development environment
        run: python -m pip install -c requirements.lock -e '.[dev]'
      - name: Reject fatal Python errors
        run: python -m ruff check src tests
      - name: Run offline tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -p no:cacheprovider
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify packaged runtime assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("hku_study_assistance_system-*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          expected = {
              "hsas/infrastructure/moodle/config/defaults.toml",
              "hsas/infrastructure/moodle/config/selectors.example.json",
              "hsas/interfaces/web/index.html",
              "hsas/interfaces/web/styles.css",
              "hsas/interfaces/web/app.js",
          }
          missing = expected - names
          if missing:
              raise SystemExit(f"wheel is missing runtime assets: {sorted(missing)}")
          PY
      - name: Smoke-test installed wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/hku_study_assistance_system-*.whl
          python -c "from hsas.infrastructure.moodle.load_settings import Settings; assert Settings().selectors().course_links"
          python -m hsas --help
